<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Нет соединения — ULove</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #FD267D;
    color: #fff;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card { max-width: 420px; text-align: center; }
  .pin {
    width: 88px;
    height: 88px;
    border-radius: 26px;
    background: #FFFFFF;
    display: grid;
    place-items: center;
    margin: 0 auto 20px;
    box-shadow: 0 18px 60px -12px rgba(122, 11, 60, .55);
    overflow: hidden;
    padding: 10px;
  }
  .pin img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: .01em; }
  p { opacity: .7; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
  button {
    background: #FFFFFF;
    color: #C9196B;
    border: 0;
    border-radius: 999px;
    padding: 13px 28px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="pin">
      <img src="/pwa-192x192.png?v=2" alt="ULove" width="88" height="88">
    </div>
    <h1>Вы оффлайн</h1>
    <p>Проверьте соединение с интернетом.<br>Лента и чаты вернутся, как только сеть появится.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
