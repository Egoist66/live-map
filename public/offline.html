<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Нет соединения — UPin</title>
<style>
  * { box-sizing: border-box; margin: 0 }
  body { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: #0F172A; color: #fff; min-height: 100dvh; display: grid; place-items: center; padding: 24px; }
  .card { max-width: 420px; text-align: center; }
  .pin { width: 88px; height: 88px; border-radius: 24px; background: #5B5BFF; display: grid; place-items: center; margin: 0 auto 20px; font-size: 44px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  p { opacity: .7; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
  button { background: #5B5BFF; color: #fff; border: 0; border-radius: 14px; padding: 13px 28px; font-size: 16px; font-weight: 600; cursor: pointer; }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="pin">📍</div>
    <h1>Вы офлайн</h1>
    <p>Проверьте соединение с интернетом.<br>Карта и чаты вернутся, как только сеть появится.</p>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
</body>
</html>
