<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F172A">
<title>Нет соединения — UPin</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: radial-gradient(120% 90% at 50% 0%, #1B2350 0%, #0F121F 55%, #0A0E1A 100%);
    color: #fff;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .card { max-width: 420px; text-align: center; }
  .pin {
    width: 88px;
    height: 88px;
    border-radius: 26px;
    background: linear-gradient(135deg, #FD267D, #E936C7 55%, #FF7854);
    display: grid;
    place-items: center;
    margin: 0 auto 20px;
    box-shadow: 0 18px 60px -12px rgba(253, 38, 125, .75);
  }
  h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: .01em; }
  p { opacity: .7; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }
  .love { font-size: 12.5px; opacity: .55; margin-bottom: 20px; }
  button {
    background: linear-gradient(90deg, #FD267D, #FF7854);
    color: #fff;
    border: 0;
    border-radius: 999px;
    padding: 13px 28px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }
  button:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="card">
    <div class="pin">
      <svg width="46" height="46" viewBox="0 0 512 512" aria-hidden="true">
        <path d="M256 108c-70 0-122 52-122 120 0 92 112 176 112 176s112-84 112-176c0-68-52-120-102-120z" fill="#fff"/>
        <path d="M256 272c-26-16-42-32-42-50 0-14 11-24 24-24 9 0 15 4 18 10 3-6 9-10 18-10 13 0 24 10 24 24 0 18-16 34-42 50z" fill="#FD267D"/>
      </svg>
    </div>
    <h1>Вы оффлайн</h1>
    <p>Проверьте соединение с интернетом.<br>Лента и чаты вернутся, как только сеть появится.</p>
    <div class="love">ULove — знакомства рядом</div>
    <button onclick="location.reload()">Попробовать снова</button>
  </div>
  <script>
    window.addEventListener('online', function () { location.reload(); });
  </script>
</body>
</html>
