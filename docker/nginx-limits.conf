limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=200r/m;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Хотлинк-защита картинок: пустой referer и свой хост разрешены, чужие — нет.
# Сравниваем хост из referer с $host (без порта) — домен знать заранее не нужно.
map "$http_referer:$host" $hotlink_deny {
    default 1;
    "~*^:" 0;
    "~*^https?://([^/:?#]+)(?::[0-9]+)?(?:[/?#]|(?=:\\1$)).*:\\1$" 0;
}

# Edge антибот (DDoS/сканеры/скрапперы): режем до PHP — дешевле держать
# флуд на nginx, чем будить Octane-воркеры. Детальный разбор UA — в
# App\Http\Middleware\BlockBadBots, капча — в TurnstileService.
# 1) UA эксплойт-китов и сканеров — всегда боты.
map "$http_user_agent" $bad_bot_ua {
    default 0;
    "~*(sqlmap|nikto|nmap|masscan|nessus|openvas|acunetix|netsparker|hydra|medusa|ncrack|metasploit|burpsuite|owasp zap|dirbuster|gobuster|dirsearch|wpscan|whatweb|zgrab|censys|shodan|binaryedge|stretchoid|libwww-perl|lwp-trivial)" 1;
}

# 2) Пустой/мусорный UA на писательных методах: у человека там всегда
# браузер, пустым ходят только скрипты. Чтение (GET) не трогаем —
# так ходят нативные клиенты, аптайм-мониторинг и часть мобильных сетей.
map "$http_user_agent:$request_method" $bad_bot_write {
    default 0;
    "~*^:(POST|PUT|PATCH|DELETE)$" 1;
    "~*^.{0,9}:(POST|PUT|PATCH|DELETE)$" 1;
}
