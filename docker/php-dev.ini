; Dev-настройки PHP: скорость без потери hot reload.
; Opcache ВКЛЮЧЁН даже в dev (ускоряет boot фреймворка в разы),
; но validate_timestamps=1 + revalidate_freq=0 — правки PHP
; подхватываются мгновенно, без рестарта контейнера.
; (Перезапуск воркеров при правках делает Octane --watch из entrypoint.)
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.enable_file_override = 0

; realpath-кэш: на Windows bind-mount каждый stat файла идёт
; через VirtioFS — кэшируем пути, чтобы не тормозить автолоад.
realpath_cache_size = 4096K
realpath_cache_ttl = 600

upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 1G
max_execution_time = 60

; Старый spiral/roadrunner-cli сыпет E_DEPRECATED на PHP 8.4
; (implicit nullable) — глушим шум в dev-логах, на поведение не влияет.
error_reporting = E_ALL & ~E_DEPRECATED
