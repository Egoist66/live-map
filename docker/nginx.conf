server {
    listen 80;
    server_name _;
    client_max_body_size 55M;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 65s;
    send_timeout 10s;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn addr 50;

    server_tokens off;

    # Базовые заголовки безопасности для всех ответов (динамика и статика).
    # CSP и HSTS ставит Laravel (нужны per-request nonce и проверка HTTPS).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(self), bluetooth=(), camera=(self), display-capture=(), encrypted-media=(), fullscreen=(self), gamepad=(), geolocation=(self), gyroscope=(), hid=(), idle-detection=(), local-fonts=(self), magnetometer=(), microphone=(self), midi=(), payment=(self), picture-in-picture=(self), publickey-credentials-create=(self), publickey-credentials-get=(self), screen-wake-lock=(self), serial=(), storage-access=(), sync-xhr=(), usb=(), web-share=(self), window-management=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    location ~ ^/(login|register|forgot-password|reset-password|email/verification-notification|confirm-password) {
        limit_req zone=auth burst=10 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }

    location ~ ^/api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }

    location /app {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header SERVER_PORT $server_port;
        proxy_set_header REMOTE_ADDR $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://127.0.0.1:8080;
    }

    # Публичная статика лендинга и корневых файлов: отдаём файлами напрямую,
    # минуя однотредный php artisan serve. /storage/, robots.txt и sitemap.xml
    # намеренно не трогаем: их отдаёт PHP (авторизация, динамика из админки).
    location ^~ /landing/ {
        root /var/www/html/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ~* ^/(favicon\.ico|manifest\.webmanifest|sw\.js|workbox-[^/]+\.js|push-sw\.js|pwa-[^/]+\.png|apple-touch-icon\.png|pwa-icon\.svg|og-cover\.jpg)$ {
        root /var/www/html/public;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Картинки: хотлинк с чужих сайтов режем 403, свой сайт и прямые заходы — можно.
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|bmp)$ {
        limit_req zone=general burst=100 nodelay;
        if ($hotlink_deny = 1) { return 403; }
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }

    # Собранные ассеты Vite: отдаём файлами напрямую, минуя PHP и limit_req.
    # Десятки параллельных запросов чанков упирались в лимитер (429), роняли
    # динамический import() страницы и уводили вкладку в цикл перезагрузок.
    # В именах файлов контент-хэш — кэшируем на год как immutable.
    location /build/ {
        root /var/www/html/public;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=general burst=100 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Scheme $scheme;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:8000;
    }
}
