name: bundle-isolation

on:
  push:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'vite.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-bundle-isolation.mjs'
  pull_request:
    paths:
      - 'resources/js/**'
      - 'vite.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'scripts/check-bundle-isolation.mjs'

jobs:
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Фронт-бандл резолвит ziggy-js в vendor/tightenco/ziggy (composer-пакет),
      # без него сборка падает с UNLOADABLE_DEPENDENCY. Скрипты композера
      # пропускаем: для vite build нужны только файлы пакета.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer install --no-scripts --no-progress --prefer-dist

      - name: Build client bundle
        run: pnpm exec vite build

      - name: Check bundle isolation
        run: pnpm check:isolation
