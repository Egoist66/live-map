services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* запекаются во фронтенд на этапе сборки (Dockerfile),
        # поэтому прокидываем их как build args. Порт 8000, а не 8080,
        # т.к. браузер ходит в Reverb через nginx-прокси /app на 80 порту.
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: "8000"
        VITE_REVERB_SCHEME: http
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_APP_NAME: ${APP_NAME}
    ports:
      - "8000:80"
    env_file: .env
    environment:
      # Должны совпадать с сервисом mysql ниже (.env рассчитан на нативный MySQL,
      # environment в compose имеет приоритет над env_file).
      DB_HOST: mysql
      DB_DATABASE: live_map
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REVERB_HOST: "127.0.0.1"
      REVERB_SERVER_HOST: "0.0.0.0"
      APP_URL: http://localhost:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app-storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  app-dev:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    working_dir: /var/www/html
    profiles: ["dev"]
    volumes:
      - .:/var/www/html
      - dev-vendor:/var/www/html/vendor
    ports:
      - "8001:8000"
      - "8080:8080"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_DATABASE: live_map
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REVERB_HOST: "127.0.0.1"
      REVERB_SERVER_HOST: "0.0.0.0"
      APP_URL: http://localhost:8001
      # SSR-процесс в dev-профиле не запущен, рендерим на клиенте.
      INERTIA_SSR_ENABLED: "false"
    # serve + reverb + queue в одном контейнере, чтобы realtime и события работали как в проде.
    # composer install — только если vendor пуст (volume dev-vendor переживает рестарты).
    #
    # ВАЖНО: serve запускается с --no-reload. Без флага artisan serve стартует
    # дочерний php -S с УРЕЗАННЫМ окружением (ServeCommand::$passthroughVariables:
    # только APP_ENV/PATH/XDEBUG/...), а DB_HOST/DB_DATABASE/REDIS_HOST и т.д.
    # вычёркиваются — и приложение внутри падает на .env-значения (127.0.0.1),
    # которые в контейнере недоступны. С --no-reload дочерний процесс наследует
    # всё окружение контейнера целиком. Перезапуск при правке .env в Docker
    # всё равно бессмысленен (конфиг едет из environment, не из файла).
    command: >
      bash -c "
      if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --prefer-dist; fi &&
      php artisan migrate --force &&
      (php artisan storage:link || true) &&
      (php artisan reverb:start --host=0.0.0.0 --port=8080 &) &&
      (php artisan queue:listen --tries=3 --sleep=3 &) &&
      exec php artisan serve --host=0.0.0.0 --port=8000 --no-reload
      "
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  vite:
    build:
      context: .
      dockerfile: docker/vite.Dockerfile
    profiles: ["dev"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - dev-node-modules:/var/www/html/node_modules
      - dev-pnpm-store:/pnpm/store
    ports:
      - "5173:5173"
    environment:
      # Windows-хост + bind-mount не пробрасывает inotify в контейнер:
      # без polling Vite не замечает правок и HMR молчит.
      VITE_WATCH_POLL: "true"
    depends_on:
      - app-dev

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: live_map
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "laravel", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

volumes:
  mysql:
  redis:
  meilisearch:
  app-storage:
  dev-vendor:
  dev-node-modules:
  dev-pnpm-store:
