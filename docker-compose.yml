services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # VITE_* запекаются во фронтенд на этапе сборки (Dockerfile),
        # поэтому прокидываем их как build args. Порт 8000, а не 8080,
        # т.к. браузер ходит в Reverb через nginx-прокси /app на 80 порту.
        VITE_REVERB_HOST: localhost
        VITE_REVERB_PORT: "8000"
        VITE_REVERB_SCHEME: http
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_APP_NAME: ${APP_NAME}
    ports:
      - "8000:80"
    env_file: .env
    environment:
      # Должны совпадать с сервисом mysql ниже (.env рассчитан на нативный MySQL,
      # environment в compose имеет приоритет над env_file).
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: live_map
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REVERB_HOST: "127.0.0.1"
      REVERB_SERVER_HOST: "0.0.0.0"
      APP_URL: http://localhost:8000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - app-storage:/var/www/html/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  # Dev-профиль: быстрый старт + hot reload всего.
  #   Backend: Octane RoadRunner с --watch (app booted в памяти воркеров,
  #     правки PHP подхватываются сами) — в разы быстрее artisan serve.
  #   Frontend: Vite HMR (:5173) с polling поверх Windows bind-mount.
  #   Realtime/очереди живут в ОТДЕЛЬНЫХ контейнерах — app-dev стартует
  #     за пару секунд и не ждёт reverb/queue, логи не смешиваются.
  # Запуск: pnpm docker:dev (без пересборки) / pnpm docker:dev:build (первый раз).
  app-dev:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    working_dir: /var/www/html
    profiles: ["dev"]
    volumes:
      - .:/var/www/html
      - dev-vendor:/var/www/html/vendor
    # Компилированные blade и файловый кэш — в RAM, а не через
    # Windows bind-mount: иначе каждый view рендерится через VirtioFS.
    tmpfs:
      - /var/www/html/storage/framework/views
      - /var/www/html/storage/framework/cache
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DEV_ROLE: app
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: live_map
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      # Серверный broadcast идёт в контейнер reverb по docker-сети,
      # а не на 127.0.0.1 (там после сплита сервисов никого нет).
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      APP_URL: http://localhost:8001
      OCTANE_SERVER: roadrunner
      # SSR-процесс в dev-профиле не запущен, рендерим на клиенте.
      INERTIA_SSR_ENABLED: "false"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      # В php:cli-образе нет curl — проверяем TCP сокет самим PHP.
      test: ["CMD-SHELL", "php -r \"exit(@fsockopen('127.0.0.1',8000)?0:1);\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # Reverb отдельно: правишь сокет-код — перезапускается только он,
  # Octane-воркеры продолжают отдавать страницы без простоя.
  reverb-dev:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    working_dir: /var/www/html
    profiles: ["dev"]
    volumes:
      - .:/var/www/html
      - dev-vendor:/var/www/html/vendor
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DEV_ROLE: reverb
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: live_map
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REVERB_HOST: "0.0.0.0"
      REVERB_SERVER_HOST: "0.0.0.0"
      REVERB_PORT: 8080
      APP_URL: http://localhost:8001
    depends_on:
      app-dev:
        condition: service_healthy
      redis:
        condition: service_started

  # Очереди отдельно: queue:listen больше не конкурирует
  # с Octane-воркерами за CPU в одном контейнере.
  queue-dev:
    build:
      context: .
      dockerfile: docker/php-dev.Dockerfile
    working_dir: /var/www/html
    profiles: ["dev"]
    volumes:
      - .:/var/www/html
      - dev-vendor:/var/www/html/vendor
    env_file: .env
    environment:
      DEV_ROLE: queue
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: live_map
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      REDIS_HOST: redis
      REVERB_HOST: reverb
      APP_URL: http://localhost:8001
    depends_on:
      app-dev:
        condition: service_healthy
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  vite:
    build:
      context: .
      dockerfile: docker/vite.Dockerfile
    profiles: ["dev"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - dev-node-modules:/var/www/html/node_modules
      - dev-pnpm-store:/pnpm/store
      # Vite pre-bundle кэш в RAM: повторный старт не пересканирует
      # сотни модулей через Windows bind-mount.
      - type: tmpfs
        target: /var/www/html/node_modules/.vite
    ports:
      - "5173:5173"
    environment:
      # Windows-хост + bind-mount не пробрасывает inotify в контейнер:
      # без polling Vite не замечает правок и HMR молчит.
      VITE_WATCH_POLL: "true"
    depends_on:
      app-dev:
        condition: service_healthy

  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: live_map
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      # Хост-порт вынесен в ${MYSQL_PORT}: на Windows часто уже висит
      # нативный MySQL на 3306. По умолчанию 3307, чтобы не конфликтовать.
      # Сменить: MYSQL_PORT=3308 docker compose up -d
      # Внутри docker-сети MySQL всё равно на 3306 (DB_PORT=3306 в app/app-dev),
      # MYSQL_PORT влияет только на доступ с хоста (TablePlus, php artisan без docker).
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "laravel", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:v1.12.3
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: masterKey
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch:/meili_data

volumes:
  mysql:
  redis:
  meilisearch:
  app-storage:
  dev-vendor:
  dev-node-modules:
  dev-pnpm-store:
